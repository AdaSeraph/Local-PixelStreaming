; ============================================================================
;  像素流 (PixelStreaming2) 内网部署设置
;  改完保存, 重新运行 Start-PixelStreaming.bat 即生效。
;  每行一个设置; 注释必须单独占一行(以 ; 开头)。
; ============================================================================

[Signalling]
; 本机是否运行信令服务器: 1 = 是(默认)
; 0 = 信令服务器在另一台电脑上, 本机只启动 UE 并连过去(同时填 [Game] SignallingAddress)
Enabled=1

; 浏览器访问的网页端口: http://本机IP:端口/ 。80 被占用时改成 8080 之类。
PlayerPort=80

; UE 程序连接信令服务器的端口。改了之后, 由脚本启动的 UE 会自动用新端口。
StreamerPort=8888

; 显示给其他设备的访问地址(本机内网 IPv4)。留空 = 自动检测。
; 本机有多块网卡、自动检测选错时填上, 例如 HostAddress=192.168.1.40
; 使用本机 TURN 时, 这个地址也是 TURN 的监听地址。
HostAddress=

; 信令消息在窗口里的显示方式: none / basic / verbose / formatted
ConsoleMessages=basic

; 每个 UE 最多同时连接的浏览器数量, 0 = 不限
MaxPlayers=0

[Game]
; Start-PixelStreaming.bat 是否顺带启动 UE 程序: 1 = 是, 0 = 否(只开信令服务器)
LaunchGame=1

; UE 程序路径。留空 = 自动使用打包目录里的 VirtualCity.exe。
; 可以写相对于本文件所在目录的路径, 例如 ..\..\..\VirtualCity.exe
GameExe=

; 信令服务器在另一台电脑上时([Signalling] Enabled=0), 填那台电脑的 IP, 例如 192.168.1.40
; 端口用上面的 StreamerPort。本机运行信令服务器时这一项不起作用。
SignallingAddress=

; UE 窗口: normal     = 和平时双击运行一样正常显示, 本机屏幕与网页画面同步(默认)
;                       注意不要最小化 UE 窗口, 最小化后网页画面会停住
;          windowed   = 强制窗口模式, 分辨率用下面的 ResX / ResY
;          fullscreen = 强制全屏, 分辨率用下面的 ResX / ResY
;          offscreen  = 不显示窗口, 只推流(服务器 / 无人值守时用)
WindowMode=normal

; 分辨率, 只对 windowed / fullscreen / offscreen 生效; 0 = 不指定
ResX=1920
ResY=1080

; UE 的 WebRTC 媒体端口范围。网管只肯放行固定端口时填写, 例如 50000 和 50100;
; 留空 = 默认 49152-65535。Open-Firewall.bat 会按这里放行。
WebRTCMinPort=
WebRTCMaxPort=

; 追加给 UE 的其他启动参数(写法和命令行一样)。
; 脚本默认加 -httpproxy="" 让 UE 不走 Windows 系统代理: 开着 VPN/代理软件或单位下发了
; 代理的电脑上, 走代理会连不上本机信令服务器。现场确实需要代理时在这里写 -httpproxy=地址:端口
ExtraArgs=

; 关闭信令服务器窗口时是否同时关闭 UE 程序: 1 = 是, 0 = 否
StopGameOnExit=1

; 网页里的操作方式不在这里设置: 打开 http://本机IP/ 时会自动带上
; HoveringMouse=true(鼠标点哪儿就是哪儿)和 FakeMouseWithTouches=true(Pad 单指点按当鼠标)。
; 需要改的话直接在地址后面写, 例如 http://本机IP/?FakeMouseWithTouches=false (Pad 用多指手势时)

[Turn]
; 媒体中继。同一内网里浏览器能直接连到本机时不需要, 保持 off。
;   off      = 不用 TURN, 内网直连(默认)
;   local    = 在本机启动自带的 TURN 服务器。适用于: 客户端到本机只放行了
;              TCP 端口, 或者 UDP 被防火墙拦住。客户端只需能访问本机的
;              PlayerPort 和下面的 Port。
;   external = 使用网管提供的内网 TURN 服务器, 需填写 Server / User / Password
Mode=off

; local: 本机 TURN 的监听端口(TCP 和 UDP)
Port=3478

; external: 服务器地址, 例如 192.168.10.30:3478
; 也可以写完整地址, 多个用逗号分隔, 例如 turn:192.168.10.30:3478?transport=tcp
Server=
; external 必填。local 留空时每次启动自动生成随机账号密码。
User=
Password=

; 1 = 强制浏览器的媒体全部走 TURN(直连完全不通时用)
ForceRelay=0
